# Local development database. Usage: docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    container_name: bachelor-chef-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bachelor_chef}
      POSTGRES_USER: ${POSTGRES_USER:-bachelor_chef_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports:
      - "5432:5432"
    volumes:
      - bachelor_chef_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the API in a container too (docker compose --profile api up --build)
  api:
    profiles: ["api"]
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bachelor_chef}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bachelor_chef_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      APP_FRONTEND_ORIGINS: ${APP_FRONTEND_ORIGINS:-http://localhost:3000}
      APP_JWT_ACCESS_SECRET: ${APP_JWT_ACCESS_SECRET:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  bachelor_chef_pgdata:
