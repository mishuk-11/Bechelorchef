spring:
  application:
    name: bachelor-chef-api
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bachelor_chef}
    username: ${SPRING_DATASOURCE_USERNAME:bachelor_chef_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${APP_IMPORT_MAX_BYTES_SPRING:5MB}
      max-request-size: 6MB
  jackson:
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:${PORT:8080}}
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    max-swallow-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  display-timezone: Asia/Dhaka
  frontend-origins: ${APP_FRONTEND_ORIGINS:http://localhost:3000}
  auth:
    jwt-secret: ${APP_JWT_ACCESS_SECRET:}
    issuer: bachelor-chef
    access-token-ttl-minutes: ${APP_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${APP_REFRESH_TOKEN_TTL_DAYS:14}
    cookie-secure: ${APP_COOKIE_SECURE:false}
    cookie-same-site: ${APP_COOKIE_SAME_SITE:Lax}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:Bachelor Chef Admin}
  imports:
    max-bytes: ${APP_IMPORT_MAX_BYTES:5242880}
    max-rows: 500
    preview-ttl-hours: 24
  media:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:bachelor-chef}
    max-image-bytes: 5242880
    allowed-image-hosts: ${APP_ALLOWED_IMAGE_HOSTS:res.cloudinary.com,images.unsplash.com,images.pexels.com,upload.wikimedia.org}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/devseed
app:
  auth:
    # Development-only fallback so `./mvnw spring-boot:run` works after copying .env.example.
    # The prod profile refuses to start without APP_JWT_ACCESS_SECRET.
    jwt-secret: ${APP_JWT_ACCESS_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}

---
spring:
  config:
    activate:
      on-profile: prod
server:
  forward-headers-strategy: framework
app:
  auth:
    cookie-secure: ${APP_COOKIE_SECURE:true}
